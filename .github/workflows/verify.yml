name: Verify NextGen PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check full Supabase archive restore guard
        run: python3 -m unittest discover -s tests -p test_restore_archive.py
      - name: Verify read-only recovery preflight script syntax
        run: bash -n scripts/recovery-lab-preflight.sh
      - name: Validate isolated restoration selection and rollback policy
        run: |
          python3 -m py_compile scripts/restore-recovery-lab.py scripts/compare-recovery-lab.py
          python3 -m unittest discover -s tests -p test_recovery_lab_restore.py
      - name: Unit test calendar and timetable labels
        run: node --test tests/local-audit-readonly.test.cjs tests/scheduling-calendar.test.cjs tests/schedule-display.test.cjs tests/yellow-seat-usage.test.cjs tests/legacy-source-comparison.test.cjs tests/september-reconciliation.test.cjs tests/admin-readiness.test.cjs tests/november-preflight.test.cjs tests/draft-regeneration-safety.test.cjs tests/november-draft-audit.test.cjs tests/schedule-transition-policy.test.cjs tests/reschedule-atomicity.test.cjs tests/profile-role-protection.test.cjs
      - name: Build
        run: npm run build

  sql-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated replacement RPC integration tests
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/replacement_fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/011_replacement_initiation.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/012_replacement_assignment.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/013_replacement_lifecycle.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/replacement_integration.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/replacement_lifecycle.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/014_attendance_management.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/attendance_integration.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/015_cancelled_reschedule_to_replacement.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/cancelled_reschedule_replacement.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/calendar_integration.sql
          psql -v ON_ERROR_STOP=1 -c 'alter table public.class_sessions add column updated_at timestamptz not null default now()'
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/017_class_replacement_capacity_override.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/class_capacity_override.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/legacy_replacement_review.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/019_legacy_yellow_seat_guard.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/legacy_yellow_seat_guard.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/020_class_capacity_review_decisions.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/class_capacity_review.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/021_september_evidence_staging.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/september_evidence_access.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/022_legacy_reconciliation_decisions.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/legacy_reconciliation_decisions.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/guardian_link_fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/023_guardian_link_resolution.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/guardian_link_resolution.sql

  operational-uat-smoke:
    name: Disposable operations UAT
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Execute synthetic class operations end to end
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/replacement_fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/011_replacement_initiation.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/012_replacement_assignment.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/013_replacement_lifecycle.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/014_attendance_management.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/uat_operational_journey.sql

  atomic-schedule-integration:
    name: Atomic schedule rollback and security
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Simulate atomic generation and forced rollback
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/atomic_schedule_fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/024_atomic_monthly_schedule_generation.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/atomic_schedule_integration.sql

  atomic-reschedule-integration:
    name: Atomic reschedule lifecycle (synthetic only)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Verify atomic reschedule initiation/assign/reopen/cancel, rollback, capacity, authorization and grants
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/replacement_fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/011_replacement_initiation.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/012_replacement_assignment.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/013_replacement_lifecycle.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/014_attendance_management.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/015_cancelled_reschedule_to_replacement.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/025_atomic_reschedule_initiation.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/atomic_reschedule_initiation.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/027_atomic_reschedule_lifecycle.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/atomic_reschedule_lifecycle.sql

  profile-role-protection:
    name: Profile role escalation protection (synthetic only)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Prove self-escalation is possible before 026 and blocked after
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/profile_role_protection.sql

  backup-restore-drill:
    name: Backup/restore safety drill (synthetic only)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      CI: 'true'
      NEXTGEN_LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      NEXTGEN_RESTORE_DRILL_URL: postgresql://postgres:postgres@127.0.0.1:5432/nextgen_restore_drill_ci
    steps:
      - uses: actions/checkout@v4
      - name: Create completely synthetic local-only source
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/backup_recovery_fixture.sql
      - name: Backup, restore to a fresh isolated DB and compare row counts
        run: |
          bash scripts/backup-local-staging.sh
          SNAP_DIR="$(find .local-backups -mindepth 1 -maxdepth 1 -type d -name 'snapshot-*' | head -n 1)"
          test -n "$SNAP_DIR"
          createdb -h localhost -p 5432 -U postgres nextgen_restore_drill_ci
          bash scripts/verify-local-restore.sh "$SNAP_DIR"
          if bash scripts/verify-local-restore.sh "$SNAP_DIR"; then
            echo 'ERROR: restore into non-empty database was allowed' >&2
            exit 1
          fi
          if NEXTGEN_RESTORE_DRILL_URL=postgresql://postgres:postgres@127.0.0.1:5432/postgres \
             python3 scripts/local-backup-guard.py restore; then
            echo 'ERROR: restoring into the postgres source would be accepted' >&2
            exit 1
          fi
          if NEXTGEN_LOCAL_DATABASE_URL=postgresql://postgres:postgres@production.example:5432/postgres \
             python3 scripts/local-backup-guard.py source; then
            echo 'ERROR: remote production backup was accepted as local' >&2
            exit 1
          fi

  recovery-two-stack:
    name: Atomic two-stack data restore (synthetic only)
    runs-on: ubuntu-latest
    services:
      source:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 24080:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      recovery:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 25196:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      NEXTGEN_LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:24080/postgres
      NEXTGEN_RECOVERY_LAB_URL: postgresql://postgres:postgres@127.0.0.1:25196/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Verify macOS-compatible recovery runtime
        run: |
          python3 --version
          python3 -m unittest discover -s tests -p test_recovery_lab_restore.py
      - name: Prepare two distinct synthetic Postgres environments
        run: |
          psql "$NEXTGEN_LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/recovery_two_stack_schema.sql
          psql "$NEXTGEN_RECOVERY_LAB_URL" -v ON_ERROR_STOP=1 -f tests/sql/recovery_two_stack_schema.sql
          psql "$NEXTGEN_LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/recovery_two_stack_source.sql
          psql "$NEXTGEN_RECOVERY_LAB_URL" -v ON_ERROR_STOP=1 -c \
            "INSERT INTO public.branches VALUES('11111111-1111-4111-8111-111111111111','Seed to replace')"
      - name: Snapshot the completely synthetic source
        run: |
          mkdir -p .local-backups/snapshot-ci-test
          pg_dump -Fc --no-owner --no-acl -d "$NEXTGEN_LOCAL_DATABASE_URL" -f .local-backups/snapshot-ci-test/database.dump
          pg_dump -Fc --no-owner --no-acl --schema=public -d "$NEXTGEN_LOCAL_DATABASE_URL" -f .local-backups/snapshot-ci-test/application-public.dump
          python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path(".local-backups/snapshot-ci-test")
          for src,dst in (("database.dump","sha256.txt"),("application-public.dump","application-sha256.txt")):
              digest=hashlib.sha256((p/src).read_bytes()).hexdigest()
              (p/dst).write_text(digest+"  "+src+"\n")
          (p/"baseline.json").write_text(json.dumps({"students":2,"parents":1,
              "active_enrollments":1,"september_source_rows":1,
              "october_source_rows":1,"november_classes":2,
              "november_bookings":1}))
          PY
      - name: Test safe dry-run and forced rollback
        run: |
          python3 scripts/restore-recovery-lab.py .local-backups/snapshot-ci-test
          psql "$NEXTGEN_RECOVERY_LAB_URL" -v ON_ERROR_STOP=1 -c \
            "ALTER TABLE public.students ADD CONSTRAINT forced_restore_failure CHECK(id <> '30000000-0000-4000-8000-000000000001')"
          if python3 scripts/restore-recovery-lab.py .local-backups/snapshot-ci-test --apply; then
            echo 'ERROR: injected restore failure did not abort transaction' >&2
            exit 1
          fi
          psql "$NEXTGEN_RECOVERY_LAB_URL" -At -c 'SELECT count(*) FROM auth.users' | grep -qx 0
          psql "$NEXTGEN_RECOVERY_LAB_URL" -At -c 'SELECT count(*) FROM public.branches' | grep -qx 1
          psql "$NEXTGEN_RECOVERY_LAB_URL" -v ON_ERROR_STOP=1 -c \
            'ALTER TABLE public.students DROP CONSTRAINT forced_restore_failure'
      - name: Restore only Auth basic identities and application data into lab
        run: |
          python3 scripts/restore-recovery-lab.py .local-backups/snapshot-ci-test --apply
          python3 scripts/compare-recovery-lab.py
          if python3 scripts/restore-recovery-lab.py .local-backups/snapshot-ci-test --apply; then
            echo 'ERROR: recovery into populated lab unexpectedly allowed' >&2
            exit 1
          fi
